[package]
name = "dstest"
version = "0.2.2"
edition = "2024"
description = "Deterministic Simulation Testing for containerised services"
license = "MIT"
repository = "https://github.com/bxrne/dstest"
documentation = "https://docs.rs/dstest"
readme = "README.md"
keywords = ["docker", "testing", "chaos", "simulation", "fault-injection"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
anyhow = "1"
bollard = "0.21.0"
futures-util = "0.3"
mlua = {version="0.12.0", features=["luajit", "async", "vendored"]}
tokio = {version = "1", features = ["full", "rt-multi-thread", "macros"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rand = "0.8"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-rustls", "postgres" ] }
serde_json = "1"
serde_yaml = "0.9"
wait-timeout = "0.2"
